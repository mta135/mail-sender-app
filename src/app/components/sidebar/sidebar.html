<!-- The [class.collapsed] dynamically adds the 'collapsed' class based on the signal state -->
<aside class="sidebar" [class.collapsed]="isCollapsed()">

    <!-- Collapse Trigger Button (sits on the sidebar edge in both states) -->
    <button type="button" class="toggle-btn" (click)="toggleSidebar()" aria-label="Toggle Sidebar"
        [attr.aria-expanded]="!isCollapsed()">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
            [class.rotated]="isCollapsed()">
            <path d="m15 18-6-6 6-6" />
        </svg>
    </button>

    <!-- Brand / Header -->
    <div class="sidebar-header">
        <div class="logo-icon"><img src="assets/sender.png" alt="" /></div>
        <span class="logo-text">Mail Sender</span>
    </div>

    <!-- Navigation Menu -->
    <nav class="sidebar-nav">
        <ul class="nav-list">
            <li>
                <a routerLink="/dashboard" routerLinkActive="active" class="nav-item" title="Dashboard">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        class="nav-icon">
                        <rect width="7" height="9" x="3" y="3" rx="1" />
                        <rect width="7" height="5" x="14" y="3" rx="1" />
                        <rect width="7" height="9" x="14" y="12" rx="1" />
                        <rect width="7" height="5" x="3" y="16" rx="1" />
                    </svg>
                    <span class="nav-label">Dashboard</span>
                </a>
            </li>
            <li>
                <a routerLink="/analytics" routerLinkActive="active" class="nav-item" title="Analytics">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        class="nav-icon">
                        <path d="M3 3v18h18" />
                        <path d="M18 17V9" />
                        <path d="M13 17V5" />
                        <path d="M8 17v-3" />
                    </svg>
                    <span class="nav-label">Analytics</span>
                </a>
            </li>
            <li>
                <a routerLink="/projects" routerLinkActive="active" class="nav-item" title="Projects">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        class="nav-icon">
                        <path d="M9 12h6" />
                        <path d="M12 9v6" />
                        <path
                            d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.93a2 2 0 0 1-1.66-.9l-.82-1.2A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z" />
                    </svg>
                    <span class="nav-label">Projects</span>
                </a>
            </li>
            <li>
                <a routerLink="/settings" routerLinkActive="active" class="nav-item" title="Settings">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        class="nav-icon">
                        <path
                            d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.1a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z" />
                        <circle cx="12" cy="12" r="3" />
                    </svg>
                    <span class="nav-label">Settings</span>
                </a>
            </li>
        </ul>
    </nav>

    <!-- User Profile Section Footer -->
    <div class="sidebar-footer">
        <div class="avatar" role="img" aria-label="Sarah Jenkins">SJ</div>
        <div class="user-info">
            <span class="user-name">Sarah Jenkins</span>
            <span class="user-email">sarah.j@aero.com</span>
        </div>
    </div>
</aside>
